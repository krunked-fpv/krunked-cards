<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141a1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='2' width='26' height='28' rx='4' fill='%23faf6ee' stroke='%231b2224' stroke-width='3'/%3E%3Cpath d='M16 7c-3 4.5-7 7-7 10.5a4 4 0 0 0 7 2.4 4 4 0 0 0 7-2.4C23 14 19 11.5 16 7zm-2 15h4l1 3h-6l1-3z' fill='%23fe5f55'/%3E%3C/svg%3E" />
    <title>Krunked Cards</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #141a1d;
        color: #ffffff;
        font-family: var(--krunked-font, 'KrunkedPixelBuiltin', monospace);
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        font-smooth: never;
        text-rendering: geometricPrecision;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #gl-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 10;
      }
      #ui-root .interactive {
        pointer-events: auto;
      }
      #crt-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        overflow: hidden;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl-canvas"></canvas>
      <div id="ui-root"></div>
      <div id="crt-overlay" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
